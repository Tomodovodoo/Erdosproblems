name: Build Prill problem 14 paper

# Triggered on the source paper and on workflow maintenance.
on:
  push:
    branches:
      - main
    paths:
      - Problemsilike/14/prills_problem_every_genus.tex
      - .github/workflows/build-prill-paper.yml
  pull_request:
    branches:
      - main
    paths:
      - Problemsilike/14/prills_problem_every_genus.tex
      - .github/workflows/build-prill-paper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended cm-super

      - name: Compile paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -cd Problemsilike/14/prills_problem_every_genus.tex

      - name: Remove auxiliary files
        run: |
          latexmk -c -cd Problemsilike/14/prills_problem_every_genus.tex

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Problemsilike/14/prills_problem_every_genus.pdf
          if git diff --cached --quiet; then
            echo "PDF is already current."
            exit 0
          fi
          git commit -m "Build Prill problem 14 paper [skip ci]"
          git push
